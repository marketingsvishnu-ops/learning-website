<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | TradeMaster Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1c;--card:#121a2b;--border:#1e2a40;--primary:#00d26a;--text:#fff;--muted:#a0aec0;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:48px;width:100%;max-width:420px;text-align:center}
.logo{font-size:1.8rem;font-weight:800;color:var(--primary);margin-bottom:8px}
.logo span{color:#fff}
h2{margin-bottom:28px;font-size:1.5rem}
input{width:100%;padding:16px;border-radius:12px;border:1px solid var(--border);background:#0d1422;color:#fff;font-size:1rem;margin-bottom:16px}
.btn{width:100%;background:var(--primary);color:#000;padding:16px;border-radius:12px;font-weight:700;border:none;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.1)}
.error{color:#ef4444;margin-top:12px;font-size:0.9rem}
.note{margin-top:24px;color:var(--muted);font-size:0.85rem}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">Trade<span>Master</span></div>
  <h2>Student Login</h2>
  <input type="text" id="userid" placeholder="User ID" autocomplete="off">
  <input type="password" id="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
  <p id="error" class="error"></p>
  <p class="note">After payment, you will receive User ID & Password.</p>
</div>

<script>
function login(){
  const uid = document.getElementById("userid").value.trim();
  const pass = document.getElementById("password").value;
  const users = JSON.parse(localStorage.getItem("tm_users") || "{}");
  
  if(users[uid] && users[uid].password === pass){
    localStorage.setItem("tm_loggedin", uid);
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error").textContent = "Invalid User ID or Password";
  }
}
// Demo user
if(!localStorage.getItem("tm_users")){
  localStorage.setItem("tm_users", JSON.stringify({
    "TM1001": { password: "pass123", name: "Demo Student", course: "beginner" }
  }));
}
</script>
</body>
</html>
