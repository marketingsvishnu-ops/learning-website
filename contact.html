<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | TradeMaster Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080f;--card:#0c1220;--border:#1e293b;--primary:#22c55e;--text:#f8fafc;--muted:#94a3b8;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:800px;margin:0 auto;padding:0 24px}
header{background:rgba(5,8,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
nav{display:flex;justify-content:space-between;align-items:center;height:70px}
.logo{font-size:1.5rem;font-weight:800;color:var(--primary);text-decoration:none}
.logo span{color:var(--text)}
nav a{color:var(--muted);text-decoration:none;margin-left:28px;font-weight:500}
nav a:hover,nav a.active{color:#fff}
.hero{padding:80px 0 40px;text-align:center}
.hero h1{font-size:2.8rem;font-weight:800}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px;margin:40px 0}
input,textarea{width:100%;padding:14px;border-radius:8px;border:1px solid var(--border);background:#0a1018;color:#fff;margin-bottom:16px;font-family:inherit}
textarea{min-height:120px}
.btn{background:var(--primary);color:#000;padding:12px 28px;border-radius:10px;font-weight:600;border:none;cursor:pointer}
footer{border-top:1px solid var(--border);padding:40px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">Trade<span>Master</span></a>
      <div>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="contact.html" class="active">Contact</a>
      </div>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>Contact Us</h1>
    <p style="color:var(--muted);margin-top:10px">Have questions? Send us a message</p>
  </div>
</section>

<div class="container">
  <div class="card">
    <form onsubmit="alert('Message sent! We will contact you soon.'); return false;">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Email" required>
      <input type="tel" placeholder="Phone (optional)">
      <textarea placeholder="Your Message" required></textarea>
      <button class="btn" type="submit">Send Message</button>
    </form>
  </div>
</div>

<footer>
  <div class="container">© 2026 TradeMaster Academy</div>
</footer>
</body>
</html>
